<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Suplai</title>
<meta name="description" content="Progress Suplai Material — PR, PO, Dikirim, Diterima">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#f3f6f8;font-family:"Segoe UI",Arial,sans-serif}
  iframe{border:0;width:100%;height:100%;display:block}
  #wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#5c6b7a;font-size:14px}
</style>
</head>
<body>
<div id="wait">Memuat Progress Suplai…</div>
<iframe id="app" title="Progress Suplai" allow="clipboard-write"></iframe>
<script>
/* Alamat aplikasi (Google Apps Script). Ganti di sini bila nanti diterbitkan ulang dengan alamat baru. */
const EXEC = "https://script.google.com/macros/s/AKfycbwjIegIN8ciCOYT_khw4qt5rxZPLcbnKI9he1WeCyZd40wqRkLr0xOzkIzYfay24QdGlg/exec";

/* Link per pengguna seperti xpdtone:  domain-anda.com/normies  atau  .../?u=normies */
const parts = location.pathname.split('/').filter(Boolean);
if (/\.github\.io$/i.test(location.hostname) && parts.length) parts.shift();   // buang nama repo di GitHub Pages
const seg = (parts[0] && !/\.html?$/i.test(parts[0])) ? decodeURIComponent(parts[0]) : '';
const user = (seg || new URLSearchParams(location.search).get('u') || '').replace(/[^\w.\-]/g, '').slice(0, 40);

const app = document.getElementById('app');
app.onload = () => { document.getElementById('wait').style.display = 'none'; };
app.src = EXEC + (user ? '?u=' + encodeURIComponent(user) : '');
document.title = user ? 'Progress Suplai — ' + user.toUpperCase() : 'Progress Suplai';
</script>
</body>
</html>
